[project]
name = "notion-site-fetch"
version = "0.1.0"
description = "Fetch any public Notion page and print it as Markdown — no token, no headless browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ilia Breitburg", email = "me@breitburg.com" },
]
keywords = ["notion", "markdown", "scraper", "cli", "notion-site"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
notion-site-fetch = "notion_site_fetch:main"

[project.urls]
Homepage = "https://github.com/breitburg/notion-site-fetch"
Source = "https://github.com/breitburg/notion-site-fetch"
Issues = "https://github.com/breitburg/notion-site-fetch/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["notion_site_fetch.py"]

[tool.hatch.build.targets.sdist]
include = ["notion_site_fetch.py", "README.md", "LICENSE", "pyproject.toml"]
